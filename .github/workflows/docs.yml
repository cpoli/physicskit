name: Docs

# Pull requests and pushes to main execute only the gallery examples a
# change set edits, or that import a module it edits
# (docs/select_examples.py); every other example comes from the cached
# gallery of the last passing main build. A pull request diffs against its
# base, a push against the commit that cached gallery was built from. The
# nightly run and manual runs execute the full gallery, which catches
# anything the selection misses; the nightly run skips the build when a
# full build already passed on the same sources and installed packages.
# Pushes to main then redeploy gh-pages. A failed Check-cell assert fails
# the build either way.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Pushes to main also deploy to gh-pages, so the hosted docs follow
    # main between releases. The group is shared with release.yml.
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name == 'push' && 'gh-pages' || format('docs-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      MPLBACKEND: Agg
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
    steps:
      - uses: actions/checkout@v7
        with:
          # On a pull request HEAD is GitHub's merge commit; its first
          # parent is the base branch, so two commits give the PR's diff.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # The animation examples save their movies with matplotlib's ffmpeg writer.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -e ".[docs]"

      # A full build is fixed by the sources and by the installed packages,
      # which are unpinned, so the key covers both: a new numpy or
      # matplotlib release changes it as surely as a commit does. Computed
      # before the build, which writes into docs/.
      - name: Key the full build
        id: key
        run: |
          deps=$({ python --version; pip freeze --exclude-editable; ffmpeg -version | head -1; } | sha256sum | cut -c1-16)
          echo "key=docs-full-${{ hashFiles('physicskit/**', 'examples/**', 'docs/**', 'pyproject.toml', '.github/workflows/docs.yml') }}-$deps" >> "$GITHUB_OUTPUT"
      # The nightly run has nothing new to check when a full build with this
      # key already passed (nightly, manual, or a push that selected every
      # example), so every later step is skipped. A run started by hand
      # always builds.
      - name: Look for a passing full build with this key
        id: done
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v5
        with:
          path: .docs-full-build
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      # Numba checks a cached function against its source file's mtime and
      # size, and a fresh checkout gives every file the current time, so
      # set each mtime from a hash of the file's contents instead: an
      # unchanged file keeps its cache entry, an edited one invalidates it.
      - name: Make source mtimes depend on content only
        if: steps.done.outputs.cache-hit != 'true'
        run: |
          python - <<'EOF'
          import hashlib, os, pathlib
          for p in pathlib.Path("physicskit").rglob("*.py"):
              h = int(hashlib.sha256(p.read_bytes()).hexdigest()[:8], 16)
              t = 1_000_000_000 + h % 500_000_000
              os.utime(p, (t, t))
          EOF
      - name: Restore numba cache
        if: steps.done.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v5
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('physicskit/**/*.py', 'pyproject.toml') }}
          restore-keys: numba-${{ runner.os }}-

      # Pull requests and pushes start from the cached gallery; the nightly
      # and manual runs, with PHYSICSKIT_GALLERY_PATTERN unset, build from
      # scratch.
      - name: Restore gallery output
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: actions/cache/restore@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ github.event.pull_request.base.sha || github.sha }}
          restore-keys: gallery-
      - name: Select examples to execute
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only HEAD^1 HEAD > changed.txt
          echo "PHYSICSKIT_GALLERY_PATTERN=$(python docs/select_examples.py < changed.txt)" >> "$GITHUB_ENV"
          echo "GALLERY_BASE=$(git rev-parse HEAD^1)" >> "$GITHUB_ENV"
      # The cached gallery records the commit it was built from. Without
      # that record, or that commit, nothing says which cached pages are
      # stale, so drop them all and run the full gallery: sphinx-gallery
      # would otherwise skip every example whose own source is unchanged.
      - name: Select examples to execute
        if: github.event_name == 'push'
        run: |
          built_from=$(cat docs/source/api/gallery/.built_from 2>/dev/null || true)
          if [ -n "$built_from" ] && git fetch --depth=1 origin "$built_from"; then
            git diff --name-only "$built_from" HEAD > changed.txt
            pattern=$(python docs/select_examples.py < changed.txt)
            echo "PHYSICSKIT_GALLERY_PATTERN=$pattern" >> "$GITHUB_ENV"
            echo "GALLERY_BASE=$built_from" >> "$GITHUB_ENV"
            # conf.py's default pattern: every example is re-executed.
            if [ "$pattern" = "/plot_" ]; then echo "FULL_GALLERY=1" >> "$GITHUB_ENV"; fi
          else
            echo "No cached gallery from a passing main build; running the full gallery."
            rm -rf docs/source/api/gallery docs/source/gen_modules
            echo "FULL_GALLERY=1" >> "$GITHUB_ENV"
          fi
      # sphinx-gallery never removes the pages of an example that no longer
      # exists, so the cached gallery would keep publishing a deleted or
      # renamed example's old page.
      - name: Drop cached pages of deleted examples
        if: env.GALLERY_BASE != ''
        run: |
          git diff --name-only --no-renames --diff-filter=D "$GALLERY_BASE" HEAD -- 'examples/*plot_*.py' |
            while read -r f; do
              rel=${f#examples/}
              d=docs/source/api/gallery/$(dirname "$rel")
              n=$(basename "$f" .py)
              echo "dropping $d/$n"
              rm -f "$d/$n".* "$d"/images/sphx_glr_"$n"_[0-9][0-9][0-9].* "$d"/images/thumb/sphx_glr_"$n"_thumb.*
            done

      - if: steps.done.outputs.cache-hit != 'true'
        run: make -C docs html
      - if: steps.done.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: echo "$GITHUB_SHA" > docs/source/api/gallery/.built_from

      # Caches are saved only from main, after a passing build, so a pull
      # request never inherits a failed or partial gallery.
      - if: steps.done.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('physicskit/**/*.py', 'pyproject.toml') }}-${{ github.run_id }}
      - if: steps.done.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ github.sha }}-${{ github.run_id }}
      - if: steps.done.outputs.cache-hit != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || env.FULL_GALLERY == '1')
        run: echo "$GITHUB_SHA" > .docs-full-build
      - if: steps.done.outputs.cache-hit != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || env.FULL_GALLERY == '1')
        uses: actions/cache/save@v5
        with:
          path: .docs-full-build
          key: ${{ steps.key.outputs.key }}

      - if: github.event_name == 'push'
        run: touch docs/build/html/.nojekyll
      - if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/build/html
          commit_message: "Deploy docs for ${{ github.sha }}"
