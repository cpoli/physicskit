name: Docs

# Pull requests execute only the gallery examples they change, or that
# import a module they change (docs/select_examples.py); every other
# example comes from the cached gallery of the last main build. Pushes to
# main, the nightly run and manual runs execute the full gallery, and
# pushes to main then redeploy gh-pages. A failed Check-cell assert fails
# the build either way.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  build:
    name: Build Sphinx docs
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # Pushes to main also deploy to gh-pages, so the hosted docs follow
    # main between releases. The group is shared with release.yml.
    permissions:
      contents: write
    concurrency:
      group: ${{ github.event_name == 'push' && 'gh-pages' || format('docs-{0}', github.ref) }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      MPLBACKEND: Agg
      NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && 0 || 1 }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"

      # Numba checks a cached function against its source file's mtime and
      # size, and a fresh checkout gives every file the current time, so
      # set each mtime from a hash of the file's contents instead: an
      # unchanged file keeps its cache entry, an edited one invalidates it.
      - name: Make source mtimes depend on content only
        run: |
          python - <<'EOF'
          import hashlib, os, pathlib
          for p in pathlib.Path("physicskit").rglob("*.py"):
              h = int(hashlib.sha256(p.read_bytes()).hexdigest()[:8], 16)
              t = 1_000_000_000 + h % 500_000_000
              os.utime(p, (t, t))
          EOF
      - name: Restore numba cache
        uses: actions/cache/restore@v5
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('physicskit/**/*.py', 'pyproject.toml') }}
          restore-keys: numba-${{ runner.os }}-

      - name: Select examples to execute
        if: github.event_name == 'pull_request'
        run: |
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" > changed.txt
          echo "PHYSICSKIT_GALLERY_PATTERN=$(python docs/select_examples.py < changed.txt)" >> "$GITHUB_ENV"
      # Only pull requests start from the cached gallery; with
      # PHYSICSKIT_GALLERY_PATTERN unset, main builds from scratch.
      - name: Restore gallery output
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ github.event.pull_request.base.sha }}
          restore-keys: gallery-

      - run: make -C docs html

      # Caches are saved only from main, after a passing build, so a pull
      # request never inherits a failed or partial gallery.
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-${{ hashFiles('physicskit/**/*.py', 'pyproject.toml') }}-${{ github.run_id }}
      - if: github.event_name != 'pull_request'
        uses: actions/cache/save@v5
        with:
          path: |
            docs/source/api/gallery
            docs/source/gen_modules
          key: gallery-${{ github.sha }}-${{ github.run_id }}

      - if: github.event_name == 'push'
        run: touch docs/build/html/.nojekyll
      - if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: docs/build/html
          commit_message: "Deploy docs for ${{ github.sha }}"
