name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff>=0.6
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
      # units/hdf5 extras so the pint and HDF5 paths are tested, not skipped.
      # h5py is installed from wheels only: on Python versions it has no
      # wheel for yet (e.g. a 3.15 prerelease) the source build fails with no
      # system HDF5, so the HDF5 tests skip there (pytest.importorskip).
      - run: pip install -e ".[test,units]"
      - run: pip install --only-binary=h5py "h5py>=3.8" || echo "::notice::No h5py wheel for Python ${{ matrix.python-version }}; HDF5 tests will be skipped"
      - run: MPLBACKEND=Agg pytest -q -n auto --cov=physicskit --cov-report=xml --cov-report=term
      # Coverage is measured on one matrix entry and published two ways:
      # the job summary (always, no token needed) and Codecov, which
      # drives the README badge.
      - name: Coverage summary
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
          coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage to Codecov
        if: always() && (matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12')
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false
      - run: MPLBACKEND=Agg pytest --doctest-modules physicskit --ignore-glob="*/tests/*" --ignore=physicskit/chaos/visualizers/viewer3d.py -q

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # No arguments: checks the whole package ([tool.mypy] files in
      # pyproject.toml), function bodies included outside the tests.
      - run: mypy
