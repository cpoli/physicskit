# Reference environment for the paper's validation, benchmarks and figures.
#
#   micromamba create -f paper/environment.yml
#   micromamba activate physicskit-paper
#   pip install -e .            # physicskit from this checkout (repository root)
name: physicskit-paper
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.5.3
  - scipy=1.18.1
  - numba=0.68.0
  - matplotlib=3.11.2
  - sympy=1.14.0
  - plotly=7.1.0
  - tqdm=4.70.1
  - qutip=5.3.1
  - astropy=8.0.1
  - pip
