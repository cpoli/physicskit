[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physicskit"
dynamic = ["version"]
description = "Unified scientific toolkit for computational physics: General Relativity, Quantum Mechanics, Chaos, Random Matrix Theory, Statistical Mechanics, Classical Dynamics, and Condensed Matter."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
maintainers = [{ name = "Charles Poli", email = "cpoli374@gmail.com" }]
keywords = [
    "physics",
    "condensed-matter",
    "general-relativity",
    "quantum-mechanics",
    "chaos",
    "random-matrix-theory",
    "statistical-mechanics",
    "classical-mechanics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "numba>=0.58",
    "plotly>=5.15",
    "sympy>=1.11",
    "tqdm>=4.65",
]

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov", "pytest-xdist>=3.0", "hypothesis>=6.90", "pillow>=9.0"]
docs = [
    "sphinx>=7.0",
    "pydata-sphinx-theme>=0.15",
    "sphinx-autodoc-typehints>=1.25",
    "myst-parser>=2.0",
    "sphinx-gallery>=0.15",
    "sphinx-design>=0.6",
]
units = ["pint>=0.23"]
hdf5 = ["h5py>=3.8"]
bench = ["pytest-benchmark>=4.0"]
dev = ["physicskit[test,docs,units,hdf5,bench]", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[project.urls]
Homepage = "https://github.com/cpoli/physicskit"
Issues = "https://github.com/cpoli/physicskit/issues"
Changelog = "https://github.com/cpoli/physicskit/blob/main/CHANGELOG.md"
Documentation = "https://cpoli.github.io/physicskit/"

[tool.setuptools.packages.find]
where = ["."]
include = ["physicskit*"]

[tool.setuptools.dynamic]
version = { attr = "physicskit.__version__" }

[tool.pytest.ini_options]
testpaths = [
    "physicskit/astro/tests",
    "physicskit/chaos/tests",
    "physicskit/classical/tests",
    "physicskit/condensed/tests",
    "physicskit/fields/tests",
    "physicskit/fluids/tests",
    "physicskit/integrators/tests",
    "physicskit/optics/tests",
    "physicskit/particle/tests",
    "physicskit/plasma/tests",
    "physicskit/quantum/tests",
    "physicskit/relativity/tests",
    "physicskit/rmt/tests",
    "physicskit/semiclassical/tests",
    "physicskit/statphys/tests",
    "physicskit/tests",
]
markers = [
    "slow: real file I/O (anim.save() GIF writes) or otherwise inherently unable to run in a few ms; excluded from the fast dev loop via `-m \"not slow\"` but always included in the full/CI run",
]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E731", # lambda assignment: used deliberately for short k-space Hamiltonian closures
    "B023", # loop-variable closures: intentional in model-builder factory functions
    "E741", # single-letter names t/M/N: standard physics notation throughout this package
    "SIM108", # if/else vs ternary: kept as if/else for readability around multi-line physics expressions
    "SIM300", # yoda-condition rewrites: not an improvement for pytest.approx(...) == value assertions
    "UP045", # X | None vs Optional[X]: keep Optional[] for clarity, it's equally valid under `from __future__ import annotations`
    "B905", # zip() without strict=: only enforceable once target-version >= py310 (dropped py3.9); ~80 pre-existing call sites need a dedicated per-site strict=True/False audit, not a blanket fix
]

[tool.ruff.lint.per-file-ignores]
"physicskit/*/tests/*" = ["E501", "E402"] # E402: pytest.importorskip(...) before imports, for optional-dependency tests
"docs/*" = ["E501", "I001", "E402"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
# Not a statement about the package's supported Python versions (that's
# requires-python = ">=3.10" above) -- current mypy no longer accepts a
# python_version below 3.10 at all, and numpy's own .pyi stubs now use
# PEP 695 `type` aliases that mypy can only parse when targeting 3.12+.
python_version = "3.12"
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
# The codebase does not fully type-check yet (mostly matplotlib/numpy stub
# gaps around animation and array-typed arguments); this config exists so
# type checking can be adopted incrementally rather than skipped entirely.
# See CONTRIBUTING.md.
check_untyped_defs = false
# `mypy` with no arguments checks only the typed core below, and CI runs it
# as a *blocking* job; `mypy physicskit` checks everything, advisory only.
# The typed core imports physicskit/__init__, which imports every
# subpackage, so errors in the rest of the package are silenced (not
# skipped: they are still analysed for types) via follow_imports below.
files = [
    "physicskit/constants.py",
    "physicskit/integrators/__init__.py",
    "physicskit/integrators/fixed_step.py",
    "physicskit/integrators/adaptive.py",
    "physicskit/units.py",
    "physicskit/results.py",
    "physicskit/io.py",
]

[[tool.mypy.overrides]]
# Typed core, blocking in CI: check the bodies of every function.
module = [
    "physicskit.constants",
    "physicskit.integrators",
    "physicskit.integrators.fixed_step",
    "physicskit.integrators.adaptive",
    "physicskit.units",
    "physicskit.results",
    "physicskit.io",
]
check_untyped_defs = true
strict_equality = true
warn_unreachable = true

[[tool.mypy.overrides]]
# New modules written fully typed from the start: hold them to (almost)
# `--strict`. The integrators can't be, since numba's @njit dispatchers
# aren't typed as the functions they wrap.
module = ["physicskit.units", "physicskit.results", "physicskit.io"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
# Everything outside the typed core: when `mypy` (typed core only) follows
# an import into it, analyse it but don't report its errors.
module = [
    "physicskit.astro.*",
    "physicskit.chaos.*",
    "physicskit.classical.*",
    "physicskit.condensed.*",
    "physicskit.fields.*",
    "physicskit.fluids.*",
    "physicskit.optics.*",
    "physicskit.particle.*",
    "physicskit.plasma.*",
    "physicskit.quantum.*",
    "physicskit.relativity.*",
    "physicskit.rmt.*",
    "physicskit.semiclassical.*",
    "physicskit.statphys.*",
    "physicskit.integrators.tests.*",
    "physicskit.tests.*",
]
follow_imports = "silent"

[tool.coverage.report]
# coverage.py cannot trace into @njit-compiled function bodies at all --
# numba compiles them to native machine code, bypassing the trace hooks
# line coverage relies on -- so they always show as "missing" even when
# a passing test exercises them behaviorally. Excluding the decorator
# line excludes coverage.py's whole decorated function (documented
# behavior), which is the honest way to report this: ~1300 of the ~3660
# lines otherwise reported missing across this codebase are inside such
# functions.
exclude_also = ["^\\s*@njit(\\(.*\\))?\\s*$"]
